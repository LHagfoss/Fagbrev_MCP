name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          git fetch origin main --force --tags
          commit="$(git rev-parse --verify "${tag}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag $tag ($commit) is not reachable from origin/main" >&2
            exit 1
          fi

          git checkout --detach "$tag"
          package_version="$(cargo metadata --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "fagbrev-mcp") | .version')"
          if [[ "${tag#v}" != "$package_version" ]]; then
            echo "Tag $tag does not match Cargo package version $package_version" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.tag }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package release binary
        shell: bash
        run: bash ./scripts/release.sh package --target "${{ matrix.target }}" --version "${{ needs.verify-tag.outputs.tag }}"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS
      - name: Attest release packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
